delivery: 11111111-1111-4111-8111-111111111111
revision: 0123456789abcdef0123456789abcdef01234567
app:
  image:
    reference: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/projects/todo@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
  pdb:
    enabled: true
  service:
    targetPort: 3000
  env:
    - name: PORT
      value: "3000"
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
    failureThreshold: 36
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 20
    failureThreshold: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi
  podAnnotations:
    opspresso.com/delivery: 11111111-1111-4111-8111-111111111111
    opspresso.com/revision: 0123456789abcdef0123456789abcdef01234567
  command:
    - node
  args:
    - server.js
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: app
