deployment: 11111111-1111-4111-8111-111111111111
app:
  controller:
    enabled: true
  image:
    reference: nexus.example/runway-images/todo@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  imagePullSecrets:
    - name: nexus-reader
  raw:
    resources:
      - apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: nexus-reader
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: SecretStore
            name: agent-runway
          target:
            name: nexus-reader
            template:
              type: kubernetes.io/dockerconfigjson
              engineVersion: v2
              data:
                .dockerconfigjson: '{"auths":{"nexus.example":{"auth":"{{ printf "runway-reader:%s" .password | b64enc }}"}}}'
          data:
            - secretKey: password
              remoteRef:
                key: /k8s/common/nexus/runway-reader-password
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
  pdb:
    enabled: true
  service:
    enabled: true
    targetPort: 3000
  routing:
    hosts:
      - todo.apps.rovr.dev
    httpRoute:
      enabled: true
  env:
    - name: PORT
      value: "3000"
  startupProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 5
    failureThreshold: 36
  readinessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 20
    failureThreshold: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi
  externalSecrets:
    annotations:
      force-sync: 11111111-1111-4111-8111-111111111111
  configmap:
    enabled: false
  podAnnotations:
    opspresso.com/deployment: 11111111-1111-4111-8111-111111111111
  command:
    - node
  args:
    - server.js
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: app
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations:
    - key: opspresso.com/arch
      operator: Equal
      value: amd64
      effect: NoSchedule
