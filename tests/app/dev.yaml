deployment: 11111111-1111-4111-8111-111111111111
app:
  controller:
    enabled: true
  image:
    reference: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/projects/todo@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  replicaCount: 1
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  service:
    enabled: true
    targetPort: 8080
  routing:
    httpRoute:
      enabled: true
  env:
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: debug
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    failureThreshold: 36
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 20
    failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
  externalSecrets:
    annotations:
      force-sync: 11111111-1111-4111-8111-111111111111
  podAnnotations:
    opspresso.com/deployment: 11111111-1111-4111-8111-111111111111
