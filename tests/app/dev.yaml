deployment: 11111111-1111-4111-8111-111111111111
app:
  controller:
    enabled: true
  image:
    reference: nexus.example/runway-images/todo@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  imagePullSecrets:
    - name: nexus-reader
  raw:
    resources:
      - apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: nexus-reader
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: SecretStore
            name: agent-runway
          target:
            name: nexus-reader
            template:
              type: kubernetes.io/dockerconfigjson
              engineVersion: v2
              data:
                .dockerconfigjson: '{"auths":{"nexus.example":{"auth":"{{ printf "runway-reader:%s" .password | b64enc }}"}}}'
          data:
            - secretKey: password
              remoteRef:
                key: /k8s/common/nexus/runway-reader-password
  replicaCount: 1
  autoscaling:
    enabled: false
  pdb:
    enabled: false
  service:
    enabled: true
    targetPort: 8080
  routing:
    hosts:
      - todo-dev.apps.rovr.dev
    httpRoute:
      enabled: true
  env:
    - name: PORT
      value: "8080"
    - name: LOG_LEVEL
      value: debug
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 5
    failureThreshold: 36
  readinessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 20
    failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
  externalSecrets:
    annotations:
      force-sync: 11111111-1111-4111-8111-111111111111
  configmap:
    enabled: true
    data:
      PGHOST: db.app-todo-dev.svc.cluster.local
      PGPORT: "5432"
  podAnnotations:
    opspresso.com/deployment: 11111111-1111-4111-8111-111111111111
  nodeSelector:
    kubernetes.io/arch: arm64
