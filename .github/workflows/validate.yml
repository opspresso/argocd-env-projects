name: Validate

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - projects/**

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v4.3.1
      - run: pip install --quiet pyyaml==6.0.3
      - run: ./scripts/test.sh
