apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-settings
data:
  REGISTRY: {{ required "registry is required" .Values.registry | quote }}
  PUSH_ROLE_ARN: {{ required "pushRoleArn is required" .Values.pushRoleArn | quote }}
  AWS_REGION: {{ .Values.region | quote }}
  AWS_DEFAULT_REGION: {{ .Values.region | quote }}
  PLATFORM: {{ .Values.platform | quote }}
  GITOPS_REPOSITORY: {{ .Values.gitops.repository | quote }}
  GITOPS_BRANCH: {{ .Values.gitops.branch | quote }}
  GIT_AUTHOR_NAME: {{ .Values.gitops.authorName | quote }}
  GIT_AUTHOR_EMAIL: {{ .Values.gitops.authorEmail | quote }}
---
# The private key of the write deploy key of the GitOps repository (deploy step only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitops-deploy-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  target:
    name: gitops-deploy-key
  data:
    - secretKey: key
      remoteRef:
        key: {{ required "gitops.deployKeyKey is required" .Values.gitops.deployKeyKey | quote }}
---
# GitHub's published SSH host keys (https://api.github.com/meta), so the deploy step verifies the server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-known-hosts
data:
  known_hosts: |
    {{- range .Values.gitops.knownHosts }}
    {{ . }}
    {{- end }}
---
# The values renderer of the deploy step (files/render.jq); scripts/test.sh checks charts/app against its output.
apiVersion: v1
kind: ConfigMap
metadata:
  name: delivery-render
data:
  render.jq: |
{{ .Files.Get "files/render.jq" | indent 4 }}
