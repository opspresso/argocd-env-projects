# Runs env-cleanup sweep every 15 minutes (see files/env-cleanup.yaml). Submitted by the Argo controller from the
# WorkflowTemplate, as the reference mode requires.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: env-cleanup
  annotations:
    # After the WorkflowTemplates: the controller validates a CronWorkflow once when it appears, and a missing
    # template leaves it unscheduled until the CronWorkflow changes.
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedules:
    - "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    workflowTemplateRef:
      name: env-cleanup
