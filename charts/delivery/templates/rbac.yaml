{{- /* One identity per step kind, so app code (test, build) never holds the GitHub token, AWS or Kubernetes access. */}}
{{- range list "delivery-runner" "delivery-git" "delivery-registry" "delivery-verify" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
{{- end }}
---
# Argo mounts this token into the executor (wait container) of the runner steps, which set
# automountServiceAccountToken: false so the step's own code gets no token. The name is Argo's convention.
apiVersion: v1
kind: Secret
metadata:
  name: delivery-runner.service-account-token
  annotations:
    kubernetes.io/service-account.name: delivery-runner
type: kubernetes.io/service-account-token
---
# The Argo executor reports step results through WorkflowTaskResults.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: delivery-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: delivery-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: delivery-executor
subjects:
{{- range list "delivery-runner" "delivery-git" "delivery-registry" "delivery-verify" }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# verify reads the rollout state of the app it deployed. Read only; Secrets are not included.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: delivery-verify
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: delivery-verify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: delivery-verify
subjects:
  - kind: ServiceAccount
    name: delivery-verify
    namespace: {{ .Release.Namespace }}
---
# Agent Delivery submits Deliveries and reads their state and step logs. It cannot change a template.
# It creates each Workflow's checkout Secret but cannot read, change or delete any Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-delivery
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-delivery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-delivery
subjects:
  - kind: ServiceAccount
    name: {{ .Values.submitter.serviceAccount }}
    namespace: {{ .Values.submitter.namespace }}
---
# Agent Delivery reads the status of the kro instances that resource-sync writes into app-* namespaces and records the
# resources as ready or failed. Read only: instances hold Secret references, never values.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-delivery-resources
rules:
  - apiGroups: [kro.run]
    resources: [rdspostgres, s3buckets, valkeycaches]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-delivery-resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-delivery-resources
subjects:
  - kind: ServiceAccount
    name: {{ .Values.submitter.serviceAccount }}
    namespace: {{ .Values.submitter.namespace }}
