{{- /* One identity per step kind, so app code (test, build) never holds the GitHub token, AWS or Kubernetes access. */}}
{{- range list "delivery-runner" "delivery-git" "delivery-source" "delivery-registry" "delivery-verify" "delivery-target" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
{{- end }}
---
# Argo mounts this token into the executor (wait container) of the runner steps, which set
# automountServiceAccountToken: false so the step's own code gets no token. The name is Argo's convention.
apiVersion: v1
kind: Secret
metadata:
  name: delivery-runner.service-account-token
  annotations:
    kubernetes.io/service-account.name: delivery-runner
type: kubernetes.io/service-account-token
---
# The Argo executor reports step results through WorkflowTaskResults.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: delivery-executor
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: delivery-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: delivery-executor
subjects:
{{- range list "delivery-runner" "delivery-git" "delivery-source" "delivery-registry" "delivery-verify" "delivery-target" }}
  - kind: ServiceAccount
    name: {{ . }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# verify reads the rollout state of the app it deployed, and live lists the objects that resource declarations
# created (kro instances, chart StatefulSets and PVCs) before cleanup. Read only; Secrets are not included.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: delivery-verify
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [kro.run]
    resources: [rdspostgres, s3buckets, dynamotables]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: delivery-verify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: delivery-verify
subjects:
  - kind: ServiceAccount
    name: delivery-verify
    namespace: {{ .Release.Namespace }}
---
# Agent Runway submits Deliveries and reads their state and step logs. It cannot change a template and has no
# access to Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-runway
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [create, get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-runway
subjects:
  - kind: ServiceAccount
    name: {{ .Values.submitter.serviceAccount }}
    namespace: {{ .Values.submitter.namespace }}
---
# Agent Runway reads the status of the kro instances and chart StatefulSets that resource-sync declares in app-*
# namespaces and records the resources as ready or failed. Kubernetes RBAC cannot select app-* namespaces, and a
# RoleBinding per namespace would need AppProject projects to allow RBAC kinds. So get applies to every StatefulSet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-runway-resources
rules:
  - apiGroups: [kro.run]
    resources: [rdspostgres, s3buckets, dynamotables]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-runway-resources
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-runway-resources
subjects:
  - kind: ServiceAccount
    name: {{ .Values.submitter.serviceAccount }}
    namespace: {{ .Values.submitter.namespace }}
