# One Delivery: build and deploy one revision of a Project environment (agent-platform docs/APP_DELIVERY.md).
# Agent Delivery is the only submitter. Every parameter comes from Agent Delivery; the app repository only provides
# the code, so it cannot choose where it is deployed. Cluster settings come from ConfigMap delivery-settings.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: app-delivery
spec:
  entrypoint: delivery
  serviceAccountName: delivery-runner
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 86400
  # Failed Pods stay until the TTL so Agent Delivery can return their logs.
  podGC:
    strategy: OnWorkflowSuccess
  securityContext:
    fsGroup: 1000
  arguments:
    parameters:
      - name: delivery
      - name: project
      - name: environment
      - name: repository
      - name: ref
      - name: applicationSha256
      - name: application
      - name: host
  # The work volume is scratch space. gp3-ephemeral deletes the EBS volume with its claim; the default gp3 class
  # retains it and leaks one volume per Delivery.
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3-ephemeral
        resources:
          requests:
            storage: 10Gi
  templates:
    - name: delivery
      dag:
        tasks:
          - name: checkout
            template: checkout
          - name: check-application
            template: check-application
            depends: checkout
          - name: test
            template: test
            depends: check-application
            when: "'{{tasks.check-application.outputs.parameters.test-image}}' != ''"
            arguments:
              parameters:
                - name: image
                  value: "{{tasks.check-application.outputs.parameters.test-image}}"
          - name: registry
            template: registry
            depends: "check-application && (test.Succeeded || test.Skipped)"
            arguments:
              parameters:
                - name: revision
                  value: "{{tasks.checkout.outputs.parameters.revision}}"
          - name: build
            template: build
            depends: registry
            when: "'{{tasks.registry.outputs.parameters.digest}}' == ''"
            arguments:
              parameters:
                - name: revision
                  value: "{{tasks.checkout.outputs.parameters.revision}}"
          - name: deploy
            template: deploy
            depends: "build.Succeeded || build.Skipped"
            arguments:
              parameters:
                - name: revision
                  value: "{{tasks.checkout.outputs.parameters.revision}}"
          - name: verify
            template: verify
            depends: deploy

    # Clones the requested ref and records the commit it resolves to. Agent Delivery writes Secret <workflow>-checkout
    # before this step runs: an empty token clones a public repository; a token (GitHub App, contents:read on this one
    # repository) goes only into a one-shot header for github.com. Nothing is stored in /work/src/.git, which the test and
    # build steps read, and redirects are refused so the header never leaves github.com.
    - name: checkout
      serviceAccountName: delivery-git
      activeDeadlineSeconds: 300
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            # Group-writable files let a test image that runs as another user write into the checkout.
            umask 0002
            git init -q /work/src
            if [ -n "${GIT_TOKEN}" ]; then
              header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GIT_TOKEN}" | base64 | tr -d '\n')"
              git -C /work/src -c http.followRedirects=false -c "http.https://github.com/.extraheader=${header}" \
                fetch -q --depth 1 "https://github.com/${REPOSITORY}.git" "${REF}"
              unset header
            else
              git -C /work/src -c http.followRedirects=false fetch -q --depth 1 "https://github.com/${REPOSITORY}.git" "${REF}"
            fi
            git -C /work/src checkout -q FETCH_HEAD
            git -C /work/src rev-parse HEAD > /work/revision
            echo "Checked out ${REPOSITORY} ${REF} at $(cat /work/revision)"
        env:
          - {name: REPOSITORY, value: "{{workflow.parameters.repository}}"}
          - {name: REF, value: "{{workflow.parameters.ref}}"}
          - {name: HOME, value: /tmp}
          - name: GIT_TOKEN
            valueFrom: {secretKeyRef: {name: "{{workflow.name}}-checkout", key: token}}
        securityContext: &unprivileged
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources: &small
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: revision
            globalName: revision
            valueFrom:
              path: /work/revision

    # The file at this revision must be the one Agent Delivery validated, or the deployed settings would differ from it.
    - name: check-application
      activeDeadlineSeconds: 120
      # Only the Argo executor (wait container) gets the ServiceAccount token; the step's own code does not.
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            cd /work/src
            if [ ! -f application.yaml ]; then echo "application.yaml is missing at this revision"; exit 1; fi
            actual=$(sha256sum application.yaml | cut -d' ' -f1)
            if [ "$actual" != "$APPLICATION_SHA256" ]; then
              echo "application.yaml at this revision ($actual) differs from the one applied to Agent Delivery ($APPLICATION_SHA256). Apply it with project_apply and start a new Delivery."
              # Agent Delivery reports application_changed for this exit code only (agent-delivery APPLICATION_CHANGED_EXIT_CODE).
              exit 3
            fi
            printf '%s' "$APPLICATION" > /work/application.json
            jq -r '.runtime.test.image // ""' /work/application.json > /work/test-image
            jq -r '.runtime.test.command // ""' /work/application.json > /work/test.sh
            jq -r '.runtime.build.context // "."' /work/application.json > /work/context
            jq -r '.runtime.build.dockerfile // "Dockerfile"' /work/application.json > /work/dockerfile
            for path in "$(cat /work/context)" "$(cat /work/context)/$(cat /work/dockerfile)"; do
              case "/$path/" in */../*) echo "build path $path leaves the repository"; exit 1;; esac
            done
            echo "application.yaml matches the applied declaration"
        env:
          - {name: APPLICATION_SHA256, value: "{{workflow.parameters.applicationSha256}}"}
          - {name: APPLICATION, value: "{{workflow.parameters.application}}"}
        securityContext: *unprivileged
        resources: *small
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: test-image
            valueFrom:
              path: /work/test-image

    # Runs the app's own test command. The Pod has no credential and reaches only DNS and the public internet.
    - name: test
      activeDeadlineSeconds: 1800
      inputs:
        parameters:
          - name: image
      # Only the Argo executor (wait container) gets the ServiceAccount token; the step's own code does not.
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: "{{inputs.parameters.image}}"
        command: [/bin/sh, /work/test.sh]
        workingDir: /work/src
        env:
          - {name: HOME, value: /tmp}
          - {name: CI, value: "true"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {memory: 4Gi}
        volumeMounts:
          - {name: work, mountPath: /work}

    # Creates the Project repository and a push credential that only reaches it. An image already built for the
    # same commit is reused: tags are immutable, so a second build of the commit could not be pushed anyway.
    - name: registry
      serviceAccountName: delivery-registry
      activeDeadlineSeconds: 300
      inputs:
        parameters:
          - name: revision
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            repository="projects/${PROJECT}"
            if ! aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository --repository-name "$repository" --image-tag-mutability IMMUTABLE \
                --image-scanning-configuration scanOnPush=true >/dev/null
              echo "Created repository $repository"
            fi
            aws ecr put-lifecycle-policy --repository-name "$repository" --lifecycle-policy-text \
              '{"rules":[{"rulePriority":1,"description":"Keep the newest 50 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":50},"action":{"type":"expire"}}]}' >/dev/null
            digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=${REVISION}" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            case "$digest" in sha256:*) echo "Reusing the image of ${REVISION}: $digest"; printf '%s' "$digest" > /work/digest; exit 0;; esac
            : > /work/digest
            session=$(aws sts assume-role --role-arn "$PUSH_ROLE_ARN" --role-session-name "delivery-${DELIVERY}" \
              --tags "Key=delivery-project,Value=${PROJECT}" --duration-seconds 3600 --output json)
            export AWS_ACCESS_KEY_ID=$(printf '%s' "$session" | jq -r .Credentials.AccessKeyId)
            export AWS_SECRET_ACCESS_KEY=$(printf '%s' "$session" | jq -r .Credentials.SecretAccessKey)
            export AWS_SESSION_TOKEN=$(printf '%s' "$session" | jq -r .Credentials.SessionToken)
            password=$(aws ecr get-login-password)
            mkdir -p /work/.docker
            umask 077
            printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY%%/*}" "$(printf 'AWS:%s' "$password" | base64 -w0)" > /work/.docker/config.json
            echo "Prepared a push credential for $repository"
        env:
          - {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - {name: DELIVERY, value: "{{workflow.parameters.delivery}}"}
          - {name: REVISION, value: "{{inputs.parameters.revision}}"}
          - {name: HOME, value: /tmp}
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext: *unprivileged
        resources: *small
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: digest
            valueFrom:
              path: /work/digest

    # Builds the Dockerfile with kaniko for the cluster's architecture and pushes it. kaniko needs no user namespace
    # or privilege (eks-demo runs Bottlerocket on EKS Auto Mode, where user namespaces are off). It runs the
    # Dockerfile as root inside this Pod, which holds only the push credential of this Project's repository.
    - name: build
      activeDeadlineSeconds: 2400
      inputs:
        parameters:
          - name: revision
      # Only the Argo executor (wait container) gets the ServiceAccount token; the step's own code does not.
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
        command: [/busybox/sh, -euc]
        args:
          - |
            context="/work/src/$(cat /work/context)"
            dockerfile="$context/$(cat /work/dockerfile)"
            image="${REGISTRY}/${PROJECT}:${REVISION}"
            trap 'rm -f /work/.docker/config.json' EXIT
            /kaniko/executor --context "dir://$context" --dockerfile "$dockerfile" --custom-platform "${PLATFORM}" \
              --destination "$image" --digest-file /work/digest --snapshot-mode redo
            echo "Pushed ${image}@$(cat /work/digest)"
        env:
          - {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - {name: REVISION, value: "{{inputs.parameters.revision}}"}
          - {name: DOCKER_CONFIG, value: /work/.docker}
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {memory: 6Gi}
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: digest
            valueFrom:
              path: /work/digest

    # Records the image and the declaration in projects/<project>/<environment>.yaml as values of charts/app (the
    # opspresso app chart); Argo CD deploys it. The init container renders them with render.jq; the push uses a deploy
    # key that can write to the GitOps repository only.
    - name: deploy
      serviceAccountName: delivery-git
      activeDeadlineSeconds: 300
      inputs:
        parameters:
          - name: revision
      initContainers:
        - name: render
          image: alpine/k8s:1.37.1
          command: [sh, -euc]
          args:
            - |
              DIGEST=$(cat /work/digest)
              case "$DIGEST" in sha256:*) ;; *) echo "No image digest to deploy"; exit 1;; esac
              { echo "# Written by the app-delivery workflow for Delivery ${DELIVERY}. Do not edit."
                jq -n --argjson application "$APPLICATION" --arg delivery "$DELIVERY" --arg revision "$REVISION" \
                  --arg repository "${REGISTRY}/${PROJECT}" --arg digest "$DIGEST" -f /etc/delivery-render/render.jq \
                  | yq -p json -o yaml; } > /work/values.yaml
              printf '%s@%s' "${REGISTRY}/${PROJECT}" "$DIGEST" > /work/image
          env:
            - {name: PROJECT, value: "{{workflow.parameters.project}}"}
            - {name: DELIVERY, value: "{{workflow.parameters.delivery}}"}
            - {name: APPLICATION, value: "{{workflow.parameters.application}}"}
            - {name: REVISION, value: "{{inputs.parameters.revision}}"}
            - {name: HOME, value: /tmp}
          envFrom:
            - configMapRef:
                name: delivery-settings
          securityContext: *unprivileged
          resources: *small
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: render, mountPath: /etc/delivery-render, readOnly: true}
      container:
        image: alpine/git:v2.54.0
        command: [sh, -euc]
        args:
          - |
            # ssh refuses a group-readable key, and the Secret volume is group-readable for fsGroup.
            install -m 0600 /var/run/delivery/deploy-key/key "$HOME/key"
            export GIT_SSH_COMMAND="ssh -i $HOME/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/delivery/known_hosts"
            git config --global user.name "$GIT_AUTHOR_NAME"
            git config --global user.email "$GIT_AUTHOR_EMAIL"
            git clone -q --depth 20 --branch "$GITOPS_BRANCH" "git@github.com:${GITOPS_REPOSITORY}.git" /work/gitops
            cd /work/gitops
            file="projects/${PROJECT}/${ENVIRONMENT}.yaml"
            write() {
              mkdir -p "projects/${PROJECT}"
              cp /work/values.yaml "$file"
            }
            write
            git add "$file"
            git commit -q -m "Deploy ${PROJECT} ${ENVIRONMENT} ${REVISION}" -m "Delivery ${DELIVERY}"
            # Other Deliveries commit to the same branch: only a rejected (non-fast-forward) push is retried on top of
            # theirs. Any other failure, such as a refused key, ends the step with Git's own message.
            attempt=1
            until git push -q origin "HEAD:${GITOPS_BRANCH}" 2>/work/push.err; do
              cat /work/push.err
              grep -qE "\[rejected\]|non-fast-forward|fetch first" /work/push.err || exit 1
              if [ "$attempt" -ge 5 ]; then echo "Could not push after $attempt attempts"; exit 1; fi
              attempt=$((attempt + 1))
              git fetch -q origin "$GITOPS_BRANCH"
              git reset -q --hard "origin/${GITOPS_BRANCH}"
              write
              git add "$file"
              git commit -q -m "Deploy ${PROJECT} ${ENVIRONMENT} ${REVISION}" -m "Delivery ${DELIVERY}"
              sleep $((attempt * 2))
            done
            echo "Committed $file at $(git rev-parse HEAD)"
        env:
          - {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - {name: ENVIRONMENT, value: "{{workflow.parameters.environment}}"}
          - {name: DELIVERY, value: "{{workflow.parameters.delivery}}"}
          - {name: REVISION, value: "{{inputs.parameters.revision}}"}
          - {name: HOME, value: /tmp}
        envFrom:
          - configMapRef:
              name: delivery-settings
        # ssh needs a passwd entry for its user, and the image has one only for root. No capability is kept; the
        # shared volume is writable through the fsGroup.
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources: *small
        volumeMounts:
          - {name: work, mountPath: /work}
          - {name: deploy-key, mountPath: /var/run/delivery/deploy-key, readOnly: true}
          - {name: known-hosts, mountPath: /etc/delivery, readOnly: true}
      volumes:
        - name: deploy-key
          secret:
            secretName: gitops-deploy-key
            defaultMode: 0440
        - name: known-hosts
          configMap:
            name: delivery-known-hosts
        - name: render
          configMap:
            name: delivery-render
      outputs:
        parameters:
          - name: image
            globalName: image
            valueFrom:
              path: /work/image

    # Waits until Argo CD rolled out the new image and the public host answers on the health path.
    - name: verify
      serviceAccountName: delivery-verify
      activeDeadlineSeconds: 900
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            namespace="app-${PROJECT}-${ENVIRONMENT}"
            health=$(printf '%s' "$APPLICATION" | jq -r '.runtime.health // "/health"')
            DIGEST=$(cat /work/digest)
            echo "Waiting for Deployment app in $namespace to run Delivery ${DELIVERY} @${DIGEST}"
            deadline=$(( $(date +%s) + 600 ))
            while :; do
              state=$(kubectl get deployment app -n "$namespace" -o json 2>/dev/null || true)
              # The Delivery annotation proves that this Delivery's commit rolled out, even when the image is reused.
              if [ -n "$state" ] && printf '%s' "$state" | jq -e --arg digest "$DIGEST" --arg delivery "$DELIVERY" '
                  (.spec.template.spec.containers[0].image | endswith("@" + $digest))
                  and (.spec.template.metadata.annotations["opspresso.com/delivery"] == $delivery)
                  and (.status.observedGeneration // 0) >= .metadata.generation
                  and (.status.updatedReplicas // 0) == (.status.replicas // -1)
                  and (.status.availableReplicas // 0) == (.status.replicas // -1)
                  and (.status.replicas // 0) > 0' >/dev/null; then
                break
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "The rollout did not finish in 10 minutes."
                kubectl get pods -n "$namespace" -o wide || true
                kubectl get events -n "$namespace" --sort-by=.lastTimestamp | tail -n 20 || true
                exit 1
              fi
              sleep 10
            done
            url="https://${HOST}"
            echo "Rollout finished. Checking ${url}${health}"
            deadline=$(( $(date +%s) + 180 ))
            until curl -fsS -o /dev/null --max-time 10 "${url}${health}"; do
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "${url}${health} did not answer with 2xx in 3 minutes"; exit 1; fi
              sleep 5
            done
            printf '%s' "$url" > /work/url
            echo "${url}${health} answered with 2xx"
        env:
          - {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - {name: ENVIRONMENT, value: "{{workflow.parameters.environment}}"}
          - {name: APPLICATION, value: "{{workflow.parameters.application}}"}
          - {name: HOST, value: "{{workflow.parameters.host}}"}
          - {name: DELIVERY, value: "{{workflow.parameters.delivery}}"}
          - {name: HOME, value: /tmp}
        securityContext: *unprivileged
        resources: *small
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: url
            globalName: url
            valueFrom:
              path: /work/url
