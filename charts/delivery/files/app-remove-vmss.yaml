# Stops the service of one Project environment on an azure-vmss Target (agent-platform docs/APP_DELIVERY.md, target): deletes
# the Front Door route, custom domain and origin group, the DNS records, the scale set, its autoscale setting, the load
# balancer, the public IP, the app identity with its role assignments and the bundle container runway-<project>-<environment>.
# Resources and Variables (the Key Vault secrets) stay. Agent Runway names the Workflow deploy-<Deployment ID>. Same
# parameters and DAG task names as app-remove-eb.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: app-remove-vmss
spec:
  entrypoint: removal
  synchronization:
    mutexes:
      - name: "deploy-{{workflow.parameters.project}}-{{workflow.parameters.environment}}"
  serviceAccountName: delivery-target
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 24h
  # The steps run as user 1000; the group makes the projected Azure token readable.
  securityContext:
    fsGroup: 1000
  arguments:
    parameters:
      - name: deployment
      - name: project
      - name: environment
      # The Target without secrets (JSON): kind azure-vmss, name, tenantId, subscriptionId, location, deployClientId,
      # keyVault, artifactStorage, resourceGroup, subnetId, dnsZoneId, frontDoorProfileId.
      - name: target
  templates:
    - name: removal
      dag:
        tasks:
          - name: remove
            template: remove
          - name: verify
            template: verify
            depends: remove

    # Deletes each resource and waits until it is gone. A resource that is already missing counts as deleted; any other
    # failed lookup stops the step.
    - name: remove
      serviceAccountName: delivery-target
      activeDeadlineSeconds: 2700
      # A Pod lost with its node (a Spot reclaim) or ended by a signal runs again; every step is safe to repeat.
      retryStrategy:
        limit: 2
        retryPolicy: Always
        backoff: {duration: 10s}
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
      # Karpenter does not move the Pod to consolidate nodes while the step runs.
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      container:
        image: mcr.microsoft.com/azure-cli:2.93.0
        command: [sh, -euc]
        args:
          - |
            . /etc/delivery-scripts/target.sh
            require name tenantId subscriptionId deployClientId keyVault artifactStorage resourceGroup dnsZoneId frontDoorProfileId
            azure_login
            echo "Removing runway-${PROJECT}-${ENVIRONMENT} (Deployment ${DEPLOYMENT})"
            python3 -I /etc/delivery-scripts/vmss-deploy.py remove
        env: &env
          - {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - {name: ENVIRONMENT, value: "{{workflow.parameters.environment}}"}
          - {name: DEPLOYMENT, value: "{{workflow.parameters.deployment}}"}
          - {name: TARGET, value: "{{workflow.parameters.target}}"}
          - {name: TARGET_KIND, value: azure-vmss}
          - {name: HOME, value: /tmp}
          - {name: AZURE_FEDERATED_TOKEN_FILE, value: /var/run/secrets/azure/tokens/azure-identity-token}
          - {name: AZURE_CORE_COLLECT_TELEMETRY, value: "no"}
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext: &unprivileged
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources: &small
          requests: {cpu: 100m, memory: 256Mi}
          limits: {memory: 1Gi}
        volumeMounts: &mounts
          - {name: scripts, mountPath: /etc/delivery-scripts, readOnly: true}
          - {name: azure-identity-token, mountPath: /var/run/secrets/azure/tokens, readOnly: true}
      volumes: &volumes
        - name: scripts
          configMap:
            name: delivery-scripts
        # The token Entra exchanges for the deploy app's access token (federated credential of delivery-target).
        - name: azure-identity-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: api://AzureADTokenExchange
                  expirationSeconds: 3600
                  path: azure-identity-token

    # Confirms that every resource is gone.
    - name: verify
      serviceAccountName: delivery-target
      activeDeadlineSeconds: 300
      # A Pod lost with its node (a Spot reclaim) or ended by a signal runs again; every step is safe to repeat.
      retryStrategy:
        limit: 2
        retryPolicy: Always
        backoff: {duration: 10s}
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
      # Karpenter does not move the Pod to consolidate nodes while the step runs.
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      container:
        image: mcr.microsoft.com/azure-cli:2.93.0
        command: [sh, -euc]
        args:
          - |
            . /etc/delivery-scripts/target.sh
            require name tenantId subscriptionId deployClientId keyVault artifactStorage resourceGroup dnsZoneId frontDoorProfileId
            azure_login
            python3 -I /etc/delivery-scripts/vmss-deploy.py removed
            echo "runway-${PROJECT}-${ENVIRONMENT} is deleted"
        env: *env
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext: *unprivileged
        resources: *small
        volumeMounts: *mounts
      volumes: *volumes
