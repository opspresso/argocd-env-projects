# One Release: test and build one revision of a Project into an image pinned by digest (agent-platform
# docs/APP_DELIVERY.md). Agent Delivery is the only submitter and names the Workflow build-<Release ID>. Every
# parameter comes from Agent Delivery; the app repository only provides the code. Cluster settings come from
# ConfigMap delivery-settings. Results: revision (commit SHA) and image (<registry>/<project>@sha256:...).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: app-build
spec:
  entrypoint: release
  serviceAccountName: delivery-runner
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 86400
  # No podGC: every step's Pod stays until the TTL removes the Workflow, so Agent Delivery can return its logs.
  securityContext:
    fsGroup: 1000
  arguments:
    parameters:
      - name: release
      - name: project
      - name: repository
      - name: ref
      - name: applicationSha256
      # The runtime section of the applied declaration, with defaults filled in (JSON).
      - name: runtime
  # The work volume is scratch space. gp3-ephemeral deletes the EBS volume with its claim; the default gp3 class
  # retains it and leaks one volume per Release.
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3-ephemeral
        resources:
          requests:
            storage: 10Gi
  templates:
    - name: release
      dag:
        tasks:
          - name: checkout
            template: checkout
          - name: check-application
            template: check-application
            depends: checkout
          - name: test
            template: test
            depends: check-application
            when: "'{{tasks.check-application.outputs.parameters.test-image}}' != ''"
            arguments:
              parameters:
                - name: image
                  value: "{{tasks.check-application.outputs.parameters.test-image}}"
          - name: registry
            template: registry
            depends: "check-application && (test.Succeeded || test.Skipped)"
            arguments:
              parameters:
                - name: revision
                  value: "{{tasks.checkout.outputs.parameters.revision}}"
          - name: build
            template: build
            depends: registry
            when: "'{{tasks.registry.outputs.parameters.digest}}' == ''"
            arguments:
              parameters:
                - name: revision
                  value: "{{tasks.checkout.outputs.parameters.revision}}"

    # Clones the requested ref and records the commit it resolves to. Agent Delivery writes Secret <workflow>-checkout
    # before this step runs: an empty token clones a public repository; a token (GitHub App, contents:read on this one
    # repository) goes only into a one-shot header for github.com. Nothing is stored in /work/src/.git, which the test and
    # build steps read, and redirects are refused so the header never leaves github.com.
    - name: checkout
      serviceAccountName: delivery-git
      activeDeadlineSeconds: 300
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            # Group-writable files let a test image that runs as another user write into the checkout.
            umask 0002
            git init -q /work/src
            if [ -n "${GIT_TOKEN}" ]; then
              header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GIT_TOKEN}" | base64 | tr -d '\n')"
              git -C /work/src -c http.followRedirects=false -c "http.https://github.com/.extraheader=${header}" \
                fetch -q --depth 1 "https://github.com/${REPOSITORY}.git" "${REF}"
              unset header
            else
              git -C /work/src -c http.followRedirects=false fetch -q --depth 1 "https://github.com/${REPOSITORY}.git" "${REF}"
            fi
            git -C /work/src checkout -q FETCH_HEAD
            git -C /work/src rev-parse HEAD > /work/revision
            echo "Checked out ${REPOSITORY} ${REF} at $(cat /work/revision)"
        env:
          - {name: REPOSITORY, value: "{{workflow.parameters.repository}}"}
          - {name: REF, value: "{{workflow.parameters.ref}}"}
          - {name: HOME, value: /tmp}
          - name: GIT_TOKEN
            valueFrom: {secretKeyRef: {name: "{{workflow.name}}-checkout", key: token}}
        securityContext: &unprivileged
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources: &small
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: revision
            globalName: revision
            valueFrom:
              path: /work/revision

    # The file at this revision must be the one Agent Delivery validated, or the deployed settings would differ from it.
    - name: check-application
      activeDeadlineSeconds: 120
      # Only the Argo executor (wait container) gets the ServiceAccount token; the step's own code does not.
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            cd /work/src
            if [ ! -f application.yaml ]; then echo "application.yaml is missing at this revision"; exit 1; fi
            actual=$(sha256sum application.yaml | cut -d' ' -f1)
            if [ "$actual" != "$APPLICATION_SHA256" ]; then
              echo "application.yaml at this revision ($actual) differs from the one applied to Agent Delivery ($APPLICATION_SHA256). Apply it with project_apply and build again."
              # Agent Delivery reports application_changed for this exit code only (agent-delivery APPLICATION_CHANGED_EXIT_CODE).
              exit 3
            fi
            printf '%s' "$RUNTIME" > /work/runtime.json
            jq -r '.test.image // ""' /work/runtime.json > /work/test-image
            jq -r '.test.command // ""' /work/runtime.json > /work/test.sh
            jq -r '.build.context // "."' /work/runtime.json > /work/context
            jq -r '.build.dockerfile // "Dockerfile"' /work/runtime.json > /work/dockerfile
            for path in "$(cat /work/context)" "$(cat /work/context)/$(cat /work/dockerfile)"; do
              case "/$path/" in */../*) echo "build path $path leaves the repository"; exit 1;; esac
            done
            echo "application.yaml matches the applied declaration"
        env:
          - {name: APPLICATION_SHA256, value: "{{workflow.parameters.applicationSha256}}"}
          - {name: RUNTIME, value: "{{workflow.parameters.runtime}}"}
        securityContext: *unprivileged
        resources: *small
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: test-image
            valueFrom:
              path: /work/test-image

    # Runs the app's own test command. The Pod has no credential and reaches only DNS and the public internet.
    - name: test
      activeDeadlineSeconds: 1800
      inputs:
        parameters:
          - name: image
      # Only the Argo executor (wait container) gets the ServiceAccount token; the step's own code does not.
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: "{{inputs.parameters.image}}"
        command: [/bin/sh, /work/test.sh]
        workingDir: /work/src
        env:
          - {name: HOME, value: /tmp}
          - {name: CI, value: "true"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {memory: 4Gi}
        volumeMounts:
          - {name: work, mountPath: /work}

    # Creates the Project repository and a push credential that only reaches it. An image already built for the
    # same commit is reused: tags are immutable, so a second build of the commit could not be pushed anyway.
    - name: registry
      serviceAccountName: delivery-registry
      activeDeadlineSeconds: 300
      inputs:
        parameters:
          - name: revision
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            repository="projects/${PROJECT}"
            if ! aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1; then
              aws ecr create-repository --repository-name "$repository" --image-tag-mutability IMMUTABLE \
                --image-scanning-configuration scanOnPush=true >/dev/null
              echo "Created repository $repository"
            fi
            aws ecr put-lifecycle-policy --repository-name "$repository" --lifecycle-policy-text \
              '{"rules":[{"rulePriority":1,"description":"Keep the newest 50 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":50},"action":{"type":"expire"}}]}' >/dev/null
            digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=${REVISION}" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            case "$digest" in sha256:*)
              echo "Reusing the image of ${REVISION}: $digest"
              printf '%s' "$digest" > /work/digest
              printf '%s/%s@%s' "$REGISTRY" "$PROJECT" "$digest" > /work/image
              exit 0;;
            esac
            : > /work/digest
            : > /work/image
            session=$(aws sts assume-role --role-arn "$PUSH_ROLE_ARN" --role-session-name "release-${RELEASE}" \
              --tags "Key=delivery-project,Value=${PROJECT}" --duration-seconds 3600 --output json)
            export AWS_ACCESS_KEY_ID=$(printf '%s' "$session" | jq -r .Credentials.AccessKeyId)
            export AWS_SECRET_ACCESS_KEY=$(printf '%s' "$session" | jq -r .Credentials.SecretAccessKey)
            export AWS_SESSION_TOKEN=$(printf '%s' "$session" | jq -r .Credentials.SessionToken)
            password=$(aws ecr get-login-password)
            mkdir -p /work/.docker
            umask 077
            printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY%%/*}" "$(printf 'AWS:%s' "$password" | base64 -w0)" > /work/.docker/config.json
            echo "Prepared a push credential for $repository"
        env:
          - {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - {name: RELEASE, value: "{{workflow.parameters.release}}"}
          - {name: REVISION, value: "{{inputs.parameters.revision}}"}
          - {name: HOME, value: /tmp}
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext: *unprivileged
        resources: *small
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: digest
            valueFrom:
              path: /work/digest
          # Set only when the image is reused; otherwise the build task sets it.
          - name: image
            globalName: image
            valueFrom:
              path: /work/image

    # Builds the Dockerfile with kaniko for the cluster's architecture and pushes it. kaniko needs no user namespace
    # or privilege (eks-demo runs Bottlerocket on EKS Auto Mode, where user namespaces are off). It runs the
    # Dockerfile as root inside this Pod, which holds only the push credential of this Project's repository.
    - name: build
      activeDeadlineSeconds: 2400
      inputs:
        parameters:
          - name: revision
      # Only the Argo executor (wait container) gets the ServiceAccount token; the step's own code does not.
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: ghcr.io/osscontainertools/kaniko:v1.29.0-debug
        command: [/busybox/sh, -euc]
        args:
          - |
            context="/work/src/$(cat /work/context)"
            dockerfile="$context/$(cat /work/dockerfile)"
            image="${REGISTRY}/${PROJECT}:${REVISION}"
            trap 'rm -f /work/.docker/config.json' EXIT
            /kaniko/executor --context "dir://$context" --dockerfile "$dockerfile" --custom-platform "${PLATFORM}" \
              --destination "$image" --digest-file /work/digest --snapshot-mode redo
            printf '%s/%s@%s' "$REGISTRY" "$PROJECT" "$(cat /work/digest)" > /work/image
            echo "Pushed ${image}@$(cat /work/digest)"
        env:
          - {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - {name: REVISION, value: "{{inputs.parameters.revision}}"}
          - {name: DOCKER_CONFIG, value: /work/.docker}
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {memory: 6Gi}
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: digest
            valueFrom:
              path: /work/digest
          - name: image
            globalName: image
            valueFrom:
              path: /work/image
