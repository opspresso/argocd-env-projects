# One golden image of an aws-asg Target (agent-platform docs/DELIVERY_V3.md D4): packer builds the AMI
# agent-runway-<name>-<version> from Amazon Linux 2023 with Docker, cfn-signal and runway-app
# (charts/delivery/files/images). Agent Runway is the only submitter and names the Workflow bake-<Image ID>.
# Result: imageId (the AMI ID). The build instance runs in the Target account with the Target's bake role.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: image-bake
spec:
  entrypoint: bake
  serviceAccountName: delivery-target
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 24h
  arguments:
    parameters:
      # The Agent Runway golden image ID (UUID).
      - name: image
      # The golden image name and version: the AMI is agent-runway-<name>-<version>.
      - name: name
      - name: version
      # The Target without secrets (JSON): kind aws-asg, name, region, bakeRole, bakeSubnet, architecture.
      - name: target
  templates:
    - name: bake
      dag:
        tasks:
          - name: build
            template: build

    - name: build
      serviceAccountName: delivery-target
      activeDeadlineSeconds: 3300
      # Assumes the bake role and leaves the session for the packer container in the Pod's scratch volume.
      initContainers:
        - name: session
          image: alpine/k8s:1.37.1
          command: [sh, -euc]
          args:
            - |
              . /etc/delivery-scripts/target.sh
              require name region bakeRole bakeSubnet architecture
              printf '%s' "$IMAGE" | grep -qE '^[0-9a-f-]{36}$' || { echo "Invalid image ID $IMAGE"; exit 1; }
              printf '%s' "$NAME" | grep -qE '^[a-z][a-z0-9-]{1,30}$' || { echo "Invalid image name $NAME"; exit 1; }
              printf '%s' "$VERSION" | grep -qE '^[0-9]{1,6}$' || { echo "Invalid image version $VERSION"; exit 1; }
              case "$(field architecture)" in arm64) arch=arm64 type=t4g.small;; amd64) arch=x86_64 type=t3.small;; *) echo "Invalid architecture"; exit 1;; esac
              ROLE_FIELD=bakeRole assume_target "bake-${IMAGE}"
              umask 077
              { echo "export AWS_ACCESS_KEY_ID='${AWS_ACCESS_KEY_ID}'"
                echo "export AWS_SECRET_ACCESS_KEY='${AWS_SECRET_ACCESS_KEY}'"
                echo "export AWS_SESSION_TOKEN='${AWS_SESSION_TOKEN}'"
                echo "export AWS_REGION='${AWS_REGION}' AWS_DEFAULT_REGION='${AWS_REGION}'"
                echo "export PKR_VAR_name='agent-runway-${NAME}-${VERSION}' PKR_VAR_region='${AWS_REGION}'"
                echo "export PKR_VAR_architecture='${arch}' PKR_VAR_instance_type='${type}'"
                echo "export PKR_VAR_subnet_id='$(field bakeSubnet)' PKR_VAR_image_id='${IMAGE}'"
              } > /work/session.sh
              cp /etc/delivery-scripts/vm-node.pkr.hcl /etc/delivery-scripts/runway-app.py /work/
          env: &env
            - {name: IMAGE, value: "{{workflow.parameters.image}}"}
            - {name: NAME, value: "{{workflow.parameters.name}}"}
            - {name: VERSION, value: "{{workflow.parameters.version}}"}
            - {name: TARGET, value: "{{workflow.parameters.target}}"}
            - {name: TARGET_KIND, value: aws-asg}
            - {name: HOME, value: /tmp}
          securityContext: &unprivileged
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources: &small
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts: &mounts
            - {name: work, mountPath: /work}
            - {name: scripts, mountPath: /etc/delivery-scripts, readOnly: true}
      container:
        image: hashicorp/packer:1.16.2
        command: [sh, -euc]
        args:
          - |
            cd /work
            . ./session.sh
            rm -f session.sh
            # Unset the Pod Identity variables so packer uses only the bake session.
            unset AWS_CONTAINER_CREDENTIALS_FULL_URI AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE
            export PACKER_PLUGIN_PATH=/work/.plugins
            packer init vm-node.pkr.hcl
            packer build -color=false vm-node.pkr.hcl
            ami=$(sed -n 's/.*"artifact_id": *"[^:"]*:\(ami-[0-9a-f]*\)".*/\1/p' manifest.json | tail -n 1)
            printf '%s' "$ami" | grep -qE '^ami-[0-9a-f]{8,17}$' || { echo "packer reported no AMI"; exit 1; }
            printf '%s' "$ami" > /tmp/image-id
            echo "Built ${ami}"
        env:
          - {name: HOME, value: /tmp}
          - {name: CHECKPOINT_DISABLE, value: "1"}
        securityContext: *unprivileged
        resources:
          requests: {cpu: 500m, memory: 512Mi}
          limits: {memory: 2Gi}
        volumeMounts: *mounts
      volumes:
        - name: work
          emptyDir: {}
        - name: scripts
          configMap:
            name: delivery-scripts
      outputs:
        parameters:
          - name: imageId
            globalName: imageId
            valueFrom:
              path: /tmp/image-id
