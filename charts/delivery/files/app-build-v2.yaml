# Build and test one commit on its requested architecture, then publish the immutable output to Nexus.
# App code receives no Git, AWS, Kubernetes or publication credential. Only the trusted publishers receive Nexus credentials.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: app-build-v2
spec:
  entrypoint: release
  serviceAccountName: delivery-runner
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 86400
  # Every step's Pod stays a day after the Workflow ends so Agent Runway can return its logs. Set it here: without
  # podGC the controller's workflowDefaults (OnPodSuccess) remove each Pod as soon as it succeeds.
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 24h
  securityContext:
    fsGroup: 1000
  arguments:
    parameters:
      - name: release
      - name: project
      # The source archive of the commit (s3://<bucket>/<cluster>/_sources/<Project ID>/<commit SHA>.tar.gz) and that
      # commit SHA.
      - name: source
      - name: revision
      - name: applicationSha256
      # The runtime section of the applied declaration, with defaults filled in (JSON).
      - name: runtime
      # Exactly one linux/amd64 or linux/arm64 platform. Tests and builds run natively on that architecture.
      - name: platforms
        value: '["linux/arm64"]'
      # Pipeline and Release ID form the immutable publication path/tag.
      - name: pipeline
        value: ""
  # The work volume is scratch space. gp3-ephemeral deletes the EBS volume with its claim; the default gp3 class
  # retains it and leaks one volume per Release.
  volumeClaimTemplates:
    - metadata:
        name: work
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: gp3-ephemeral
        resources:
          requests:
            storage: 10Gi
  # Every eks-demo node is Spot. A step whose Pod a Spot reclaim stops (the Pod is deleted, or its container ends on
  # SIGTERM with exit code 143) runs again (retryStrategy &reclaimed) on another node in the work volume's AZ; every step
  # is safe to repeat. A step's own failure (any other exit code, or its deadline) is not retried. Agent Runway counts
  # only the latest attempt of a step.
  templates:
    - name: release
      # One Pod at a time: every step mounts the same ReadWriteOnce work volume.
      parallelism: 1
      dag:
        tasks:
          - name: checkout
            template: checkout
          - name: check-application
            template: check-application
            depends: checkout
          - name: test
            template: test
            depends: check-application
            when: "'{{tasks.check-application.outputs.parameters.test-image}}' != ''"
            arguments:
              parameters:
                - name: image
                  value: "{{tasks.check-application.outputs.parameters.test-image}}"
                - name: arch
                  value: '{{tasks.check-application.outputs.parameters.arch}}'
          - name: build
            template: build
            depends: check-application && (test.Succeeded || test.Skipped)
            when: "'{{tasks.check-application.outputs.parameters.kind}}' == 'container'"
            arguments:
              parameters:
                - name: arch
                  value: "{{tasks.check-application.outputs.parameters.arch}}"
          - name: build-artifact
            template: build-artifact
            depends: check-application && (test.Succeeded || test.Skipped)
            when: "'{{tasks.check-application.outputs.parameters.kind}}' == 'artifact'"
            arguments:
              parameters:
                - name: arch
                  value: '{{tasks.check-application.outputs.parameters.arch}}'
                - name: image
                  value: '{{tasks.check-application.outputs.parameters.build-image}}'
          - name: publish-image
            template: publish-image
            depends: build.Succeeded
            arguments:
              parameters:
                - name: arch
                  value: '{{tasks.check-application.outputs.parameters.arch}}'
          - name: publish-artifact
            template: publish-artifact
            depends: build-artifact.Succeeded
            arguments:
              parameters:
                - name: arch
                  value: '{{tasks.check-application.outputs.parameters.arch}}'
    - name: checkout
      serviceAccountName: delivery-source
      activeDeadlineSeconds: 300
      retryStrategy: &reclaimed
        limit: 2
        retryPolicy: Always
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
        backoff: {duration: 10s}
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            # Group-writable files let a test image that runs as another user write into the checkout.
            umask 0002
            case "${REVISION}" in ""|*[!0-9a-f]*) echo "invalid revision"; exit 1 ;; esac
            case "${SOURCE}" in s3://*/_sources/*.tar.gz) ;; *) echo "invalid source"; exit 1 ;; esac
            # A step that runs again after a reclaimed node starts from an empty directory.
            rm -rf /work/src /work/source.tar.gz
            mkdir /work/src
            aws s3 cp --only-show-errors "${SOURCE}" /work/source.tar.gz
            tar -xzf /work/source.tar.gz -C /work/src --strip-components=1
            rm /work/source.tar.gz
            printf '%s\n' "${REVISION}" > /work/revision
            echo "Unpacked the source at ${REVISION}"
        env:
          - {name: SOURCE, value: "{{workflow.parameters.source}}"}
          - {name: REVISION, value: "{{workflow.parameters.revision}}"}
          - {name: HOME, value: /tmp}
          - name: AWS_REGION
            valueFrom: {configMapKeyRef: {name: delivery-settings, key: AWS_REGION}}
        securityContext: &unprivileged
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources: &small
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: revision
            globalName: revision
            valueFrom:
              path: /work/revision

    # The file at this revision must be the one Agent Runway validated, or the deployed settings would differ from it.
    - name: check-application
      activeDeadlineSeconds: 120
      retryStrategy: *reclaimed
      # Only the Argo executor (wait container) gets the ServiceAccount token; the step's own code does not.
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            cd /work/src
            if [ ! -f application.yaml ]; then echo "application.yaml is missing at this revision"; exit 1; fi
            actual=$(sha256sum application.yaml | cut -d' ' -f1)
            if [ "$actual" != "$APPLICATION_SHA256" ]; then
              echo "application.yaml at this revision ($actual) differs from the one applied to Agent Runway ($APPLICATION_SHA256). Apply it with project_apply and build again."
              # Agent Runway reports application_changed for this exit code only (agent-runway APPLICATION_CHANGED_EXIT_CODE).
              exit 3
            fi
            printf '%s' "$RUNTIME" > /work/runtime.json
            jq -r '.test.image // ""' /work/runtime.json > /work/test-image
            jq -r '.test.command // ""' /work/runtime.json > /work/test.sh
            jq -r '.build.context // "."' /work/runtime.json > /work/context
            jq -r '.build.dockerfile // "Dockerfile"' /work/runtime.json > /work/dockerfile
            for path in "$(cat /work/context)" "$(cat /work/context)/$(cat /work/dockerfile)"; do
              case "/$path/" in */../*) echo "build path $path leaves the repository"; exit 1;; esac
            done
            echo "application.yaml matches the applied declaration"

            jq -r '.build.kind // "container"' /work/runtime.json > /work/kind
            jq -r '.build.image // ""' /work/runtime.json > /work/build-image
            jq -r '.build.command // ""' /work/runtime.json > /work/build.sh
            arch=$(printf '%s' "$PLATFORMS" | jq -er 'if length == 1 and (.[0] == "linux/amd64" or .[0] == "linux/arm64") then .[0] | split("/")[1] else error("one architecture required") end')
            printf '%s' "$arch" > /work/arch
        env:
          - {name: APPLICATION_SHA256, value: "{{workflow.parameters.applicationSha256}}"}
          - {name: RUNTIME, value: "{{workflow.parameters.runtime}}"}
          - name: PLATFORMS
            value: '{{workflow.parameters.platforms}}'
        securityContext: *unprivileged
        resources: *small
        volumeMounts:
          - {name: work, mountPath: /work}
      outputs:
        parameters:
          - name: test-image
            valueFrom:
              path: /work/test-image

    # Runs the app's own test command. The Pod has no credential and reaches only DNS and the public internet.
          - name: kind
            valueFrom:
              path: /work/kind
          - name: build-image
            valueFrom:
              path: /work/build-image
          - name: arch
            valueFrom:
              path: /work/arch
    - name: test
      activeDeadlineSeconds: 1800
      retryStrategy: *reclaimed
      inputs:
        parameters:
          - name: image
      # Only the Argo executor (wait container) gets the ServiceAccount token; the step's own code does not.
          - name: arch
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: "{{inputs.parameters.image}}"
        command:
          - /bin/sh
          - -euc
        workingDir: /work/src
        env:
          - {name: HOME, value: /tmp}
          - {name: CI, value: "true"}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 500m, memory: 1Gi}
          limits: {memory: 4Gi}
        volumeMounts:
          - {name: work, mountPath: /work}

        args:
          - |
            umask 0002
            exec /bin/sh -eu /work/test.sh
      nodeSelector:
        kubernetes.io/arch: '{{inputs.parameters.arch}}'
      tolerations:
        - key: opspresso.com/delivery-build
          operator: Equal
          value: 'true'
          effect: NoSchedule
    - name: build
      activeDeadlineSeconds: 2400
      retryStrategy: *reclaimed
      inputs:
        parameters:
          - name: arch
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      nodeSelector:
        kubernetes.io/arch: "{{inputs.parameters.arch}}"
      tolerations:
        - {key: opspresso.com/delivery-build, operator: Equal, value: "true", effect: NoSchedule}
      container:
        image: ghcr.io/osscontainertools/kaniko:v1.29.1-debug
        command: [/busybox/sh, -euc]
        args:
          - |
            context="/work/src/$(cat /work/context)"
            context=$(realpath "$context")
            case "$context/" in /work/src/*) ;; *) echo "build context leaves source"; exit 1;; esac
            dockerfile=$(realpath "$context/$(cat /work/dockerfile)")
            case "$dockerfile" in /work/src/*) ;; *) echo "Dockerfile leaves source"; exit 1;; esac
            rm -f /work/image.tar
            /kaniko/executor --context "dir://$context" --dockerfile "$dockerfile" --custom-platform "linux/${ARCH}"   --destination "build.local/app:${RELEASE}" --no-push --tar-path /work/image.tar --snapshot-mode redo
        env:
          - {name: ARCH, value: "{{inputs.parameters.arch}}"}
          - name: RELEASE
            value: '{{workflow.parameters.release}}'
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {memory: 6Gi}
        volumeMounts:
          - {name: work, mountPath: /work}

    - name: build-artifact
      activeDeadlineSeconds: 1800
      retryStrategy:
        limit: 2
        retryPolicy: Always
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
        backoff:
          duration: 10s
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      inputs:
        parameters:
          - name: arch
          - name: image
      nodeSelector:
        kubernetes.io/arch: '{{inputs.parameters.arch}}'
      tolerations:
        - key: opspresso.com/delivery-build
          operator: Equal
          value: 'true'
          effect: NoSchedule
      container:
        image: '{{inputs.parameters.image}}'
        command:
          - /bin/sh
          - -euc
        args:
          - |
            umask 0002
            context=$(cat /work/context)
            cd "/work/src/$context"
            exec /bin/sh -eu /work/build.sh
        env:
          - name: HOME
            value: /tmp
          - name: CI
            value: 'true'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: '1'
            memory: 1Gi
          limits:
            memory: 4Gi
        volumeMounts:
          - name: work
            mountPath: /work
    - name: publish-image
      activeDeadlineSeconds: 1800
      retryStrategy:
        limit: 2
        retryPolicy: Always
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
        backoff:
          duration: 10s
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: gcr.io/go-containerregistry/crane/debug:v0.22.1
        command:
          - /busybox/sh
          - -euc
        args:
          - |
            test -f /work/image.tar && test ! -L /work/image.tar
            size=$(stat -c %s /work/image.tar)
            [ "$size" -gt 0 ] && [ "$size" -le 2147483648 ] || { echo "image archive exceeds size limit"; exit 1; }
            mkdir -p /tmp/docker
            export DOCKER_CONFIG=/tmp/docker
            trap 'rm -rf /tmp/docker' EXIT
            printf '%s' "$NEXUS_PASSWORD" | crane auth login "${REGISTRY%%/*}" --username "$NEXUS_USERNAME" --password-stdin
            image="${REGISTRY}/${PROJECT}:${PIPELINE}-${RELEASE}"
            digest=$(crane digest --tarball /work/image.tar)
            if existing=$(crane digest "$image" 2>/tmp/registry-error); then
              [ "$existing" = "$digest" ] || { echo "immutable image tag contains another digest"; exit 1; }
            else
              if ! grep -Eq 'MANIFEST_UNKNOWN|NAME_UNKNOWN' /tmp/registry-error; then cat /tmp/registry-error >&2; exit 1; fi
              crane push /work/image.tar "$image" --image-refs /tmp/image
            fi
            actual=$(crane digest "$image")
            [ "$actual" = "$digest" ] || { echo "published image digest differs"; exit 1; }
            printf '%s/%s@%s' "$REGISTRY" "$PROJECT" "$actual" > /tmp/image
        env:
          - name: PROJECT
            value: '{{workflow.parameters.project}}'
          - name: PIPELINE
            value: '{{workflow.parameters.pipeline}}'
          - name: RELEASE
            value: '{{workflow.parameters.release}}'
          - name: RUNTIME
            value: '{{workflow.parameters.runtime}}'
          - name: NEXUS_USERNAME
            value: runway-publisher
          - name: NEXUS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: delivery-nexus
                key: publisherPassword
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi
        volumeMounts:
          - name: work
            mountPath: /work
            readOnly: true
      outputs:
        parameters:
          - name: image
            globalName: image
            valueFrom:
              path: /tmp/image
      inputs:
        parameters:
          - name: arch
      nodeSelector:
        kubernetes.io/arch: '{{inputs.parameters.arch}}'
      tolerations:
        - key: opspresso.com/delivery-build
          operator: Equal
          value: 'true'
          effect: NoSchedule
    - name: publish-artifact
      activeDeadlineSeconds: 1800
      retryStrategy:
        limit: 2
        retryPolicy: Always
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
        backoff:
          duration: 10s
      automountServiceAccountToken: false
      executor:
        serviceAccountName: delivery-runner
      metadata:
        labels:
          opspresso.com/delivery-role: runner
      container:
        image: python:3.14-alpine
        command:
          - python3
          - -I
          - /scripts/artifacts.py
        env:
          - name: PROJECT
            value: '{{workflow.parameters.project}}'
          - name: PIPELINE
            value: '{{workflow.parameters.pipeline}}'
          - name: RELEASE
            value: '{{workflow.parameters.release}}'
          - name: RUNTIME
            value: '{{workflow.parameters.runtime}}'
          - name: NEXUS_USERNAME
            value: runway-publisher
          - name: NEXUS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: delivery-nexus
                key: publisherPassword
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        volumeMounts:
          - name: work
            mountPath: /work
            readOnly: true
          - name: scripts
            mountPath: /scripts
            readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: delivery-scripts
      outputs:
        parameters:
          - name: artifact
            globalName: artifact
            valueFrom:
              path: /tmp/artifact.json
      inputs:
        parameters:
          - name: arch
      nodeSelector:
        kubernetes.io/arch: '{{inputs.parameters.arch}}'
      tolerations:
        - key: opspresso.com/delivery-build
          operator: Equal
          value: 'true'
          effect: NoSchedule
