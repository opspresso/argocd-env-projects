# Deploy a verified Nexus JAR/WAR on the selected native Java SE or Tomcat platform.
# The bundle contains only secret references; the instance resolves Secrets Manager with its scoped role.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: app-deploy-eb
spec:
  entrypoint: deployment
  # Shared with app-deploy and app-remove-eb: one change per Project environment at a time.
  synchronization:
    mutexes:
      - name: "deploy-{{workflow.parameters.project}}-{{workflow.parameters.environment}}"
  serviceAccountName: delivery-target
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 24h
  securityContext:
    fsGroup: 1000
  arguments:
    parameters:
      - name: deployment
      - name: project
      - name: environment
      # Native file identity: format, URL, SHA-256 and size.
      - name: artifact
      - name: application
      - name: host
      # The Target without secrets (JSON): kind aws-eb, account, region, deployRole, artifactBucket, solutionStack,
      # serviceRole, permissionsBoundary, vpcId, instanceSubnets, loadBalancerSubnets, certificateArn, hostedZoneId,
      # secretsKeyArn; optional externalId (a Target in another AWS account) and installScript (runs on each instance
      # before the app, as the prebuild hook 00-install.sh).
      - name: target
  templates:
    - name: deployment
      dag:
        tasks:
          - name: deploy
            template: deploy
          - name: verify
            template: verify
            depends: deploy

    # Writes the source bundle (with the Target's install script, if any) and creates or updates the stack
    # runway-<project>-<environment> in the Target account. CloudFormation rolls a failed update back. With the
    # Immutable rollout, instances are replaced only after the new ones pass the health check, so a failed Deployment
    # (also a failed install script) leaves the previous Release running. With the AllAtOnce rollout of a sandbox
    # environment the app is down while the instances take the Release, and after a failure until the rollback ends.
    - name: deploy
      serviceAccountName: delivery-target
      activeDeadlineSeconds: 3300
      # A Pod lost with its node (a Spot reclaim) or ended by a signal runs again; every step is safe to repeat.
      retryStrategy:
        limit: 2
        retryPolicy: Always
        backoff: {duration: 10s}
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
      # Karpenter does not move the Pod to consolidate nodes while the step runs.
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            . /etc/delivery-scripts/target.sh
            require name region deployRole artifactBucket solutionStack serviceRole permissionsBoundary vpcId \
              instanceSubnets loadBalancerSubnets certificateArn hostedZoneId secretsKeyArn
            python3 -I /etc/delivery-scripts/artifacts.py download
            stack="runway-${PROJECT}-${ENVIRONMENT}"
            secrets_path="/agent-runway/$(field name)/${PROJECT}/${ENVIRONMENT}"
            instance_type=$(instance_type)
            rollout=$(rollout)
            min=$(printf '%s' "$APPLICATION" | jq -r '.environment.replicas // 1')
            max=$(printf '%s' "$APPLICATION" | jq -r '.environment.maxReplicas // .environment.replicas // 1')
            health=$(printf '%s' "$APPLICATION" | jq -r '.runtime.health // "/health"')
            public_ip=$(public_ip)

            printf '%s' "$APPLICATION" > /tmp/application.json
            install_script /tmp/install.sh
            python3 -I /etc/delivery-scripts/eb-bundle.py /tmp/application.json /tmp/application-artifact "$secrets_path" "$(field region)" "$(field account)" /tmp/bundle.zip /tmp/install.sh
            format=$(printf '%s' "$APPLICATION" | jq -r '.native.format')
            python3 -I /etc/delivery-scripts/eb-bundle.py bootstrap "$format" /tmp/bootstrap.zip
            key="${PROJECT}/${ENVIRONMENT}/${DEPLOYMENT}.zip"
            jq -n \
              --arg Project "$PROJECT" --arg Environment "$ENVIRONMENT" --arg DeploymentId "$DEPLOYMENT" \
              --arg SolutionStackName "$(field solutionStack)" --arg ServiceRoleArn "$(field serviceRole)" \
              --arg PermissionsBoundaryArn "$(field permissionsBoundary)" \
              --arg VersionBucket "$(field artifactBucket)" --arg VersionKey "$key" --arg VpcId "$(field vpcId)" \
              --arg InstanceSubnets "$(list instanceSubnets)" --arg LoadBalancerSubnets "$(list loadBalancerSubnets)" \
              --arg InstancePublicIp "$public_ip" \
              --arg CertificateArn "$(field certificateArn)" --arg HostedZoneId "$(field hostedZoneId)" --arg Host "$HOST" \
              --arg InstanceType "$instance_type" --arg MinSize "$min" --arg MaxSize "$max" \
              --arg HealthPath "$health" --arg Rollout "$rollout" --arg SecretsPath "$secrets_path" \
              --arg SecretsKeyArn "$(field secretsKeyArn)" '$ARGS.named' > /tmp/parameters.json
            assume_target "deploy-${DEPLOYMENT}"
            python3 -I /etc/delivery-scripts/eb-deploy.py /tmp/parameters.json /tmp/bundle.zip /tmp/bootstrap.zip
        env:
          - &id001 {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - &id002 {name: ENVIRONMENT, value: "{{workflow.parameters.environment}}"}
          - &id003 {name: DEPLOYMENT, value: "{{workflow.parameters.deployment}}"}
          - name: ARTIFACT
            value: '{{workflow.parameters.artifact}}'
          - &id004 {name: APPLICATION, value: "{{workflow.parameters.application}}"}
          - &id005 {name: HOST, value: "{{workflow.parameters.host}}"}
          - &id006 {name: TARGET, value: "{{workflow.parameters.target}}"}
          - &id007 {name: TARGET_KIND, value: aws-eb}
          - &id008 {name: HOME, value: /tmp}
          - name: NEXUS_USERNAME
            value: runway-reader
          - name: NEXUS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: delivery-nexus
                key: readerPassword
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext: &unprivileged
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources: &small
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts: &mounts
          - {name: scripts, mountPath: /etc/delivery-scripts, readOnly: true}
      volumes: &volumes
        - name: scripts
          configMap:
            name: delivery-scripts

    # Waits until the environment runs this Deployment's version with Ok health and the host answers on the health path.
    - name: verify
      serviceAccountName: delivery-target
      activeDeadlineSeconds: 900
      # A Pod lost with its node (a Spot reclaim) or ended by a signal runs again; every step is safe to repeat.
      retryStrategy:
        limit: 2
        retryPolicy: Always
        backoff: {duration: 10s}
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
      # Karpenter does not move the Pod to consolidate nodes while the step runs.
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            . /etc/delivery-scripts/http-health.sh
            . /etc/delivery-scripts/target.sh
            require region deployRole
            stack="runway-${PROJECT}-${ENVIRONMENT}"
            health=$(printf '%s' "$APPLICATION" | jq -r '.runtime.health // "/health"')
            assume_target "verify-${DEPLOYMENT}"
            environment=$(aws cloudformation describe-stacks --stack-name "$stack" \
              --query 'Stacks[0].Outputs[?OutputKey==`EnvironmentName`].OutputValue' --output text)
            deadline=$(( $(date +%s) + 600 ))
            while :; do
              state=$(aws elasticbeanstalk describe-environments --environment-names "$environment" --output json \
                --query 'Environments[0].{status:Status,health:HealthStatus,version:VersionLabel}')
              version=$(printf '%s' "$state" | jq -r .version)
              description=$(aws elasticbeanstalk describe-application-versions --application-name "$stack" \
                --version-labels "$version" --query 'ApplicationVersions[0].Description' --output text)
              if printf '%s' "$state" | jq -e '.status == "Ready" and .health == "Ok"' >/dev/null \
                && [ "$description" = "Deployment ${DEPLOYMENT}" ]; then
                break
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "Environment $environment did not run Deployment ${DEPLOYMENT} with Ok health in 10 minutes: $state"
                aws elasticbeanstalk describe-events --environment-name "$environment" --max-items 20 \
                  --query 'Events[].[EventDate,Severity,Message]' --output text || true
                exit 1
              fi
              sleep 10
            done
            url="https://${HOST}"
            echo "Environment $environment runs Deployment ${DEPLOYMENT}. Checking ${url}${health}"
            deadline=$(( $(date +%s) + 300 ))
            until http_healthy "${url}${health}"; do
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "${url}${health} did not answer with 2xx in 5 minutes"; exit 1; fi
              sleep 5
            done
            printf '%s' "$url" > /tmp/url
            echo "${url}${health} answered with 2xx"
        env:
          - *id001
          - *id002
          - *id003
          - name: ARTIFACT
            value: '{{workflow.parameters.artifact}}'
          - *id004
          - *id005
          - *id006
          - *id007
          - *id008
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext: *unprivileged
        resources: *small
        volumeMounts: *mounts
      volumes: *volumes
      outputs:
        parameters:
          - name: url
            globalName: url
            valueFrom:
              path: /tmp/url
