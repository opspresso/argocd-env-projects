# One Deployment to an aws-asg Target (agent-platform docs/DELIVERY_V3.md D2): deploy one Release (an image pinned by
# digest) to the Auto Scaling group of one Project environment. Agent Runway is the only submitter and
# names the Workflow deploy-<Deployment ID>. Every parameter comes from Agent Runway, which chose the Target, the
# environment and its host. Result: url (https://<host>). Same parameters, results and DAG task names as app-deploy,
# plus target.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: app-deploy-asg
spec:
  entrypoint: deployment
  # Shared with app-deploy and app-remove-asg: one change per Project environment at a time.
  synchronization:
    mutexes:
      - name: "deploy-{{workflow.parameters.project}}-{{workflow.parameters.environment}}"
  serviceAccountName: delivery-target
  activeDeadlineSeconds: 3600
  ttlStrategy:
    secondsAfterSuccess: 86400
    secondsAfterFailure: 86400
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 24h
  securityContext:
    fsGroup: 1000
  arguments:
    parameters:
      - name: deployment
      - name: project
      - name: environment
      # The Release image: <registry>/<project>@sha256:<digest>.
      - name: image
      # The declaration of this environment with defaults filled in (JSON {runtime, environment, config}).
      - name: application
      - name: host
      # The Target without secrets (JSON): kind aws-asg, name, account, region, deployRole, imageId (the golden image
      # AMI), permissionsBoundary, vpcId, instanceSubnets, loadBalancerSubnets, certificateArn, hostedZoneId,
      # secretsKeyArn, instanceTypes, defaultInstanceType.
      - name: target
  templates:
    - name: deployment
      dag:
        tasks:
          - name: deploy
            template: deploy
          - name: verify
            template: verify
            depends: deploy

    # Creates or updates the stack runway-<project>-<environment> (asg-stack.yaml) in the Target account. A new Auto
    # Scaling group replaces the old one only after its instances signal a healthy app; otherwise CloudFormation rolls
    # back, so a failed Deployment leaves the previous Release running.
    - name: deploy
      serviceAccountName: delivery-target
      activeDeadlineSeconds: 3300
      # A Pod lost with its node (a Spot reclaim) or ended by a signal runs again; every step is safe to repeat.
      retryStrategy:
        limit: 2
        retryPolicy: Always
        backoff: {duration: 10s}
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
      # Karpenter does not move the Pod to consolidate nodes while the step runs.
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            . /etc/delivery-scripts/target.sh
            require name region deployRole imageId permissionsBoundary vpcId \
              instanceSubnets loadBalancerSubnets certificateArn hostedZoneId secretsKeyArn instanceTypes defaultInstanceType
            printf '%s' "$IMAGE" | grep -qE "^${REGISTRY}/${PROJECT}@sha256:[a-f0-9]{64}$" \
              || { echo "Image $IMAGE is not an image of ${REGISTRY}/${PROJECT} pinned by digest"; exit 1; }
            stack="runway-${PROJECT}-${ENVIRONMENT}"
            secrets_path="/agent-runway/$(field name)/${PROJECT}/${ENVIRONMENT}"
            instance_type=$(printf '%s' "$APPLICATION" | jq -r --arg default "$(field defaultInstanceType)" '.environment.instanceType // $default')
            printf '%s' "$TARGET" | jq -e --arg type "$instance_type" '.instanceTypes | index($type)' >/dev/null \
              || { echo "Instance type $instance_type is not allowed on Target $(field name)"; exit 1; }
            min=$(printf '%s' "$APPLICATION" | jq -r '.environment.replicas // 1')
            max=$(printf '%s' "$APPLICATION" | jq -r '.environment.maxReplicas // .environment.replicas // 1')
            health=$(printf '%s' "$APPLICATION" | jq -r '.runtime.health // "/health"')
            registry_account=${REGISTRY%%.*}
            registry_region=$(printf '%s' "$REGISTRY" | cut -d. -f4)

            # /etc/runway/app.json of the instances (charts/delivery/files/images/runway-app.py). No secret value.
            config=$(printf '%s' "$APPLICATION" | jq -c --arg image "$IMAGE" --arg secrets "$secrets_path" --arg region "$(field region)" '
              {image: $image, port: .runtime.port, health: (.runtime.health // "/health"), secretsPath: $secrets, region: $region,
               env: ((.environment.env // {}) + (.config // {})), command: (.runtime.command // []), args: (.runtime.args // [])}')
            app_config=$(printf '%s' "$config" | base64 -w0)
            # A CloudFormation parameter value holds at most 4096 bytes.
            [ "${#app_config}" -le 4096 ] || { echo "The runtime and non-secret Variables exceed 3 KiB for an aws-asg Target"; exit 1; }
            assume_target "deploy-${DEPLOYMENT}"
            # An earlier attempt of this step may have left an operation running; deploy after it ends.
            until status=$(aws cloudformation describe-stacks --stack-name "$stack" --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NONE); \
              case "$status" in *_IN_PROGRESS) false;; *) true;; esac; do
              echo "Waiting for stack $stack ($status)"; sleep 15
            done
            echo "Updating stack ${stack} to Deployment ${DEPLOYMENT} (${IMAGE})"
            aws cloudformation deploy --stack-name "$stack" --template-file /etc/delivery-scripts/asg-stack.yaml \
              --capabilities CAPABILITY_NAMED_IAM --no-fail-on-empty-changeset \
              --tags "opspresso.com/delivery-project=${PROJECT}" "opspresso.com/delivery-env=${ENVIRONMENT}" \
              --parameter-overrides \
                "Project=${PROJECT}" "Environment=${ENVIRONMENT}" "DeploymentId=${DEPLOYMENT}" \
                "ImageId=$(field imageId)" "PermissionsBoundaryArn=$(field permissionsBoundary)" "VpcId=$(field vpcId)" \
                "InstanceSubnets=$(list instanceSubnets)" "LoadBalancerSubnets=$(list loadBalancerSubnets)" \
                "CertificateArn=$(field certificateArn)" "HostedZoneId=$(field hostedZoneId)" "Host=${HOST}" \
                "InstanceType=${instance_type}" "MinSize=${min}" "MaxSize=${max}" "HealthPath=${health}" \
                "SecretsPath=${secrets_path}" "SecretsKeyArn=$(field secretsKeyArn)" \
                "RepositoryArn=arn:aws:ecr:${registry_region}:${registry_account}:repository/${REGISTRY#*/}/${PROJECT}" \
                "AppConfig=${app_config}" \
              || { aws cloudformation describe-stack-events --stack-name "$stack" --max-items 20 \
                     --query 'StackEvents[?contains(ResourceStatus, `FAILED`)].[LogicalResourceId,ResourceStatusReason]' --output text || true; exit 1; }
        env: &env
          - {name: PROJECT, value: "{{workflow.parameters.project}}"}
          - {name: ENVIRONMENT, value: "{{workflow.parameters.environment}}"}
          - {name: DEPLOYMENT, value: "{{workflow.parameters.deployment}}"}
          - {name: IMAGE, value: "{{workflow.parameters.image}}"}
          - {name: APPLICATION, value: "{{workflow.parameters.application}}"}
          - {name: HOST, value: "{{workflow.parameters.host}}"}
          - {name: TARGET, value: "{{workflow.parameters.target}}"}
          - {name: TARGET_KIND, value: aws-asg}
          - {name: HOME, value: /tmp}
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext: &unprivileged
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        resources: &small
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts: &mounts
          - {name: scripts, mountPath: /etc/delivery-scripts, readOnly: true}
      volumes: &volumes
        - name: scripts
          configMap:
            name: delivery-scripts

    # Checks that the stack runs this Deployment and the host answers on the health path.
    - name: verify
      serviceAccountName: delivery-target
      activeDeadlineSeconds: 900
      # A Pod lost with its node (a Spot reclaim) or ended by a signal runs again; every step is safe to repeat.
      retryStrategy:
        limit: 2
        retryPolicy: Always
        backoff: {duration: 10s}
        expression: lastRetry.status == "Error" || lastRetry.exitCode == "143"
      # Karpenter does not move the Pod to consolidate nodes while the step runs.
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: "true"
      container:
        image: alpine/k8s:1.37.1
        command: [sh, -euc]
        args:
          - |
            . /etc/delivery-scripts/target.sh
            require region deployRole
            stack="runway-${PROJECT}-${ENVIRONMENT}"
            health=$(printf '%s' "$APPLICATION" | jq -r '.runtime.health // "/health"')
            assume_target "verify-${DEPLOYMENT}"
            # The stack records the Deployment it last applied; CloudFormation completed it only with healthy instances.
            state=$(aws cloudformation describe-stacks --stack-name "$stack" --output json \
              --query 'Stacks[0].{status:StackStatus,deployment:Outputs[?OutputKey==`DeploymentId`]|[0].OutputValue}')
            if ! printf '%s' "$state" | jq -e --arg deployment "$DEPLOYMENT" '(.status == "CREATE_COMPLETE" or .status == "UPDATE_COMPLETE") and .deployment == $deployment' >/dev/null; then
              echo "Stack $stack does not run Deployment ${DEPLOYMENT}: $state"; exit 1
            fi
            url="https://${HOST}"
            echo "Stack $stack runs Deployment ${DEPLOYMENT}. Checking ${url}${health}"
            deadline=$(( $(date +%s) + 300 ))
            until curl -fsS -o /dev/null --max-time 10 "${url}${health}"; do
              if [ "$(date +%s)" -ge "$deadline" ]; then echo "${url}${health} did not answer with 2xx in 5 minutes"; exit 1; fi
              sleep 5
            done
            printf '%s' "$url" > /tmp/url
            echo "${url}${health} answered with 2xx"
        env: *env
        envFrom:
          - configMapRef:
              name: delivery-settings
        securityContext: *unprivileged
        resources: *small
        volumeMounts: *mounts
      volumes: *volumes
      outputs:
        parameters:
          - name: url
            globalName: url
            valueFrom:
              path: /tmp/url
