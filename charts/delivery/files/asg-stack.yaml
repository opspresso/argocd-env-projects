AWSTemplateFormatVersion: "2010-09-09"
# One Project environment on an aws-asg Target (agent-platform docs/DELIVERY_V3.md D2, D4). The app-deploy-asg
# Workflow creates or updates the stack runway-<project>-<environment>; app-remove-asg deletes it. Every value comes
# from Agent Runway and the Target, never from the app repository.
#
# A new Deployment replaces the Auto Scaling group (AutoScalingReplacingUpdate): CloudFormation starts a new group,
# waits until MinSize instances signal that the app answers on its health path, then deletes the old group. When the
# new instances do not signal in time the update rolls back and the old group keeps serving.
#
# The Target's install script (agent-platform docs/DELIVERY_V4.md D5) runs from the user data before the app starts.
# When it exits non-zero, the instance signals the failure and does not start the app, so the update rolls back.
Description: Agent Runway app on an Auto Scaling group

Parameters:
  Project:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
  Environment:
    Type: String
    AllowedPattern: "^[a-z][a-z0-9]{1,11}$"
  DeploymentId:
    Type: String
  ImageId:
    Type: AWS::EC2::Image::Id
    Description: The Target's golden image (charts/delivery/files/images/vm-node.pkr.hcl).
  PermissionsBoundaryArn:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  InstanceSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  LoadBalancerSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  CertificateArn:
    Type: String
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  Host:
    Type: String
    AllowedPattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"
  InstanceType:
    Type: String
  MinSize:
    Type: Number
    MinValue: 1
    MaxValue: 10
  MaxSize:
    Type: Number
    MinValue: 1
    MaxValue: 10
  HealthPath:
    Type: String
    AllowedPattern: "^/.*$"
  SecretsPath:
    Type: String
    AllowedPattern: "^/agent-runway/[a-z0-9-]+/[a-z0-9-]+/[a-z0-9]+$"
  SecretsKeyArn:
    Type: String
  RepositoryArn:
    Type: String
  AppConfig:
    Type: String
    Description: The base64 of /etc/runway/app.json (image digest, port, health, non-secret Variables, command, args).
  # The Target's install script as base64 of gzip, split because a parameter value holds at most 4096 bytes. All empty
  # when the Target has no install script.
  InstallScript1:
    Type: String
    Default: ""
  InstallScript2:
    Type: String
    Default: ""
  InstallScript3:
    Type: String
    Default: ""

Resources:
  # Named <stack>-app so the Target deploy role, which may change only roles and instance profiles named
  # runway-<project>-<environment>-*, can manage them.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-app
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runway-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParametersByPath]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretsPath}
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !Ref SecretsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
              - Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: "*"
              - Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Ref RepositoryArn
              - Effect: Allow
                Action: [cloudformation:SignalResource]
                Resource: !Ref AWS::StackId

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${AWS::StackName}-app
      Roles: [!Ref InstanceRole]

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }

  # Instances accept only the environment's load balancer.
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${AWS::StackName} instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup, Description: App }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref LoadBalancerSubnets
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: !Ref HealthPath
      Matcher: { HttpCode: "200-299" }
      HealthCheckIntervalSeconds: 10
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions: { HttpTokens: required, HttpEndpoint: enabled, HttpPutResponseHopLimit: 1 }
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 20, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - { Key: Name, Value: !Ref AWS::StackName }
              - { Key: opspresso.com/delivery-project, Value: !Ref Project }
              - { Key: opspresso.com/delivery-env, Value: !Ref Environment }
              - { Key: opspresso.com/deployment, Value: !Ref DeploymentId }
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -uo pipefail
              signal() {
                /opt/aws/bin/cfn-signal --exit-code "$1" --region ${AWS::Region} --stack ${AWS::StackName} --resource Group
                exit "$1"
              }
              echo '${AppConfig}' | base64 -d > /etc/runway/app.json
              chmod 0600 /etc/runway/app.json
              if [ -n '${InstallScript}' ]; then
                (umask 077; echo '${InstallScript}' | base64 -d | gunzip > /etc/runway/install.sh) || signal 1
                chmod 0700 /etc/runway/install.sh
                /etc/runway/install.sh || signal $?
              fi
              /usr/local/bin/runway-app start
              signal $?
            - InstallScript: !Join ["", [!Ref InstallScript1, !Ref InstallScript2, !Ref InstallScript3]]

  Group:
    Type: AWS::AutoScaling::AutoScalingGroup
    CreationPolicy:
      ResourceSignal:
        Count: !Ref MinSize
        Timeout: PT15M
    UpdatePolicy:
      AutoScalingReplacingUpdate:
        WillReplace: true
    Properties:
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref MinSize
      VPCZoneIdentifier: !Ref InstanceSubnets
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      Tags:
        - { Key: opspresso.com/delivery-project, Value: !Ref Project, PropagateAtLaunch: false }
        - { Key: opspresso.com/delivery-env, Value: !Ref Environment, PropagateAtLaunch: false }

  # CPU 70 % target tracking between MinSize and MaxSize, like the HPA of aws-eks environments.
  Scaling:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref Group
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ASGAverageCPUUtilization }
        TargetValue: 70

  Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Host
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID

Outputs:
  GroupName:
    Value: !Ref Group
  DeploymentId:
    Value: !Ref DeploymentId
